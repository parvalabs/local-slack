# Declarative definition of the local workspace, the app/bot under test, users and channels.
# Everything here is fake and only used locally.

workspace:
  name: Test Workspace
  domain: test-workspace
  teamId: T01TEST

app:
  appId: A01APP
  botUserId: U0BOT
  botName: testbot
  botToken: xoxb-test-token
  appToken: xapp-test-token          # used for apps.connections.open (Socket Mode)
  signingSecret: test-signing-secret  # used to sign HTTP deliveries so Bolt accepts them

  # How events are delivered to the bot:
  #   socket -> Bolt connects a WebSocket (apps.connections.open hands back our ws:// URL)
  #   events -> we POST signed requests to requestUrl below
  mode: socket
  requestUrl: http://localhost:4000/slack/events

users:
  # `email` is optional. It's surfaced as profile.email on users.info /
  # users.list, and is what users.lookupByEmail matches against — set it if your
  # app resolves people by email. Note that, as in real Slack, message events
  # carry only the user id, so a bot that needs the address looks it up.
  - { id: U01ALICE, name: alice, real_name: Alice Anderson, email: alice@example.com }
  - { id: U02BOB, name: bob, real_name: Bob Brown, email: bob@example.com }

channels:
  - { id: C01GEN, name: general, members: [U01ALICE, U02BOB, U0BOT] }
  - { id: C02RND, name: random, members: [U01ALICE, U0BOT] }
