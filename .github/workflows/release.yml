# Builds, signs, notarizes and publishes a release when its tag is pushed.
#
# The two-phase release is unchanged, the second phase just moves here:
#
#   1. bun run release:prepare X.Y.Z    (local) bump versions, build, review
#   2. git commit -m "Bump to vX.Y.Z" && git push
#   3. git tag vX.Y.Z && git push origin vX.Y.Z    ← starts this workflow
#
# Pushing the tag is the confirmation step that running publish-release.ts by
# hand used to be. Everything after it — npm, the GitHub release, the Homebrew
# tap — happens here, from binaries signed with a real Developer ID rather than
# ad-hoc, which local builds can't do without the certificate.
#
# Required repository secrets:
#   APPLE_CERT_P12_BASE64   Developer ID Application cert + private key, as .p12, base64'd
#   APPLE_CERT_PASSWORD     the password set when exporting that .p12
#   APPLE_SIGNING_IDENTITY  e.g. "Developer ID Application: Parva Labs LLC (TEAMID)"
#   APPLE_API_KEY_P8_BASE64 App Store Connect API key (.p8), base64'd, for notarization
#   APPLE_API_KEY_ID        that key's ID
#   APPLE_API_ISSUER_ID     that key's issuer UUID
#   NPM_TOKEN               npm Automation token (bypasses 2FA; a Publish token would prompt)
#   HOMEBREW_TAP_TOKEN      PAT with contents:write on parvalabs/homebrew-tools
# GITHUB_TOKEN is provided automatically and only needs the contents permission below.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # create the GitHub release and upload its archives

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # macOS because codesign and notarytool are macOS-only. Bun cross-compiles
    # the Linux and Windows binaries from here, exactly as a local build does.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `gh release --generate-notes` diffs against the previous tag

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Only for the npm auth it writes into ~/.npmrc — the build itself is Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches the version in the source
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EMBEDDED=$(grep -o 'VERSION = "[^"]*"' server/src/version.ts | cut -d'"' -f2 || true)
          if [ "$VERSION" != "$EMBEDDED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match server/src/version.ts ($EMBEDDED). Run release:prepare $VERSION and commit before tagging."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: cd server && bun test

      # Signing is skipped rather than fatal when the Apple secrets aren't set
      # yet, so releases keep working (ad-hoc signed, as local builds are) while
      # the certificate is still being sorted out. The warning below is what
      # keeps that from passing unnoticed.
      - name: Warn when Apple signing is not configured
        if: ${{ secrets.APPLE_SIGNING_IDENTITY == '' }}
        run: echo "::warning::APPLE_SIGNING_IDENTITY is not set — shipping ad-hoc signed macOS binaries, which Gatekeeper will warn about on download."

      - name: Import the signing certificate
        if: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Throwaway password for a throwaway keychain that dies with the runner.
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt for keychain access
          # that nobody is there to answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build and sign the binaries
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bun run build:binaries

      - name: Verify the macOS binaries are really Developer ID signed
        if: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          for arch in arm64 x64; do
            BIN="npm/local-slack-darwin-$arch/bin/local-slack"
            codesign --verify --strict --verbose=2 "$BIN"
            DETAILS=$(codesign --display --verbose=2 "$BIN" 2>&1)
            # if/then, not `grep -q ... && fail`: under `bash -eo pipefail` a grep
            # that finds nothing exits non-zero, which would fail the step on the
            # path where everything is fine.
            if echo "$DETAILS" | grep -q "Signature=adhoc"; then
              echo "::error::$BIN is ad-hoc signed, not Developer ID signed"; exit 1
            fi
            if ! echo "$DETAILS" | grep -q "TeamIdentifier=[A-Z0-9]"; then
              echo "::error::$BIN has no team identifier"; exit 1
            fi
            if ! echo "$DETAILS" | grep -q "flags=.*runtime"; then
              echo "::error::$BIN was signed without the hardened runtime"; exit 1
            fi
          done

      - name: Notarize
        if: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" bun run server/scripts/notarize-macos.ts
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Publish to npm, GitHub Releases and the Homebrew tap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # consumed by ~/.npmrc from setup-node
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # used by `gh release create`
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_DIR: ${{ runner.temp }}/homebrew-tools
        run: bun run server/scripts/publish-release.ts "$VERSION"

      - name: Remove the signing keychain
        if: ${{ always() && secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
